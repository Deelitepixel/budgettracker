<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>💰 Budget Tracker</h1>

    <!-- Summary Cards -->
    <div class="summary">
      <div class="card card-balance">
        <span class="card-label">Balance</span>
        <span class="card-amount" id="balance">$0.00</span>
      </div>
      <div class="card card-income">
        <span class="card-label">Income</span>
        <span class="card-amount" id="income">$0.00</span>
      </div>
      <div class="card card-expense">
        <span class="card-label">Expenses</span>
        <span class="card-amount" id="expense">$0.00</span>
      </div>
    </div>

    <!-- Transaction Form -->
    <form id="transaction-form" class="form">
      <h2 id="form-title">Add Transaction</h2>
      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Groceries" required />
      </div>
      <div class="form-group">
        <label for="amount">Amount ($)</label>
        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
      </div>
      <div class="form-group">
        <label for="type">Type</label>
        <select id="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Transaction</button>
        <button type="button" class="btn btn-cancel" id="cancel-btn" style="display:none;">Cancel</button>
      </div>
    </form>

    <!-- Search -->
    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 Search transactions…" />
    </div>

    <!-- Transaction List -->
    <div id="transaction-list" class="transaction-list"></div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <span class="empty-icon">📭</span>
      <p>No transactions yet.<br/>Add one above to get started!</p>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirm-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <p>Are you sure you want to delete this transaction?</p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="confirm-yes">Delete</button>
        <button class="btn btn-cancel" id="confirm-no">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
